<title> Findie </title>

<body>
    <div ng-app="Findie" ng-controller="findieCtrl">
        <div id="main-container">
            <div id="logo">
                <p class="logo">Findie</p>
            </div>
                <div id="afterbox">
            <center><button type="button" id="tryagain" style="display:none" class="btn btn-primary btn-lg" ng-click='tryAgain()'>Try Again</button></center>
                </div>

            <center>
            <div id="input-box">
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <button id='dropdown' class="btn btn-outline-secondary dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Search By:</button>
                        <div class="dropdown-menu">
                            <!--<a class="dropdown-item" ng-click='artist()' href="#">By artist</a> -->
                            <a class="dropdown-item" href="#" ng-click='song()'>By song</a>
                            <!-- <a class="dropdown-item" href="#" ng-click='url()'>By URL</a> -->
                        </div>
                    </div>
                    <input type="text" class="form-control" id="box1" placeholder=""><input id="box2" type="text" class="form-control" placeholder="Artist" style="display:none;">

                </div>
            </br>
            </div>
            </center>
            <div id="progressbar-container">
                <div id="progressbar" style="display:none"></div>
                <center><span id="progressbar-label" style="display: none"></span></center>
                <div id="logininfo">
                    <center><button type="button" id="startbutton" class="btn btn-success btn-lg" ng-click='getStarted()'>Get Started</button><button type="button" id="startbutton" class="btn btn-primary btn-lg" ng-click='start()' style="display:none">Start</button></center>
                </div>

            </div>
        </div>
    </div>
    <div id="spotifydata-container" style="display: none">
        <div id="spotifydata-1" style="display: none"><iframe id="spot1" src="https://open.spotify.com/embed?uri=spotify:album:1DFixLWuPkv3KT3TnV35m3" width="480" height="80" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe></div>
        <div id="spotifydata-2" style="display: none"><iframe id="spot2" src="https://open.spotify.com/embed?uri=spotify:album:1DFixLWuPkv3KT3TnV35m3" width="480" height="80" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe></div>
        <div id="spotifydata-3" style="display: none"><iframe id="spot3" src="https://open.spotify.com/embed?uri=spotify:album:1DFixLWuPkv3KT3TnV35m3" width="480" height="80" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe></div>
    </div>

</div>
